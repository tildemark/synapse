name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Android Build
  # ─────────────────────────────────────────────────────────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk synapse_v${VERSION}_android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: synapse_*.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows Build
  # ─────────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $src = "build\windows\x64\runner\Release"
          $zip = "synapse_v${version}_windows_x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          Write-Host "Created $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: synapse_*.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Synapse ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*