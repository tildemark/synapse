name: synapse
description: "Synapse — Master any subject with spaced repetition. Physics, Algebra, C, Linux, Excel, and more."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.42

  # State Management
  flutter_riverpod: ^2.6.1

  # Vectors & Graphics
  flutter_svg: ^2.0.10+1

  # Storage & Utilities
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/logo512.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/icons/logo512.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/packs/